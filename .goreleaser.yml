version: 2
project_name: oc

# Release publication remains disabled until the OC channel is provisioned.
release:
  disable: true

env:
  - CGO_ENABLED=0
  - GOTOOLCHAIN=local

before:
  hooks:
    - go mod download

builds:
  - id: oc
    binary: oc
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm, ppc64le, s390x]
    goarm: ['7']
    ignore:
      - {goos: darwin, goarch: arm}
      - {goos: darwin, goarch: ppc64le}
      - {goos: darwin, goarch: s390x}
      - {goos: windows, goarch: arm}
      - {goos: windows, goarch: ppc64le}
      - {goos: windows, goarch: s390x}
      - {goos: freebsd, goarch: arm}
      - {goos: freebsd, goarch: arm64}
      - {goos: freebsd, goarch: ppc64le}
      - {goos: freebsd, goarch: s390x}
    flags: [-tags=kqueue, -trimpath]
    ldflags:
      - "-s -w -X github.com/soulteary/mc/cmd.Version={{.Version}} -X github.com/soulteary/mc/cmd.ReleaseTag={{.Tag}} -X github.com/soulteary/mc/cmd.CommitID={{.FullCommit}} -X github.com/soulteary/mc/cmd.ShortCommitID={{.ShortCommit}}"

  - id: oc-console
    binary: oc-console
    main: ./cmd/oc-console
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm, ppc64le, s390x]
    goarm: ['7']
    ignore:
      - {goos: darwin, goarch: arm}
      - {goos: darwin, goarch: ppc64le}
      - {goos: darwin, goarch: s390x}
      - {goos: windows, goarch: arm}
      - {goos: windows, goarch: ppc64le}
      - {goos: windows, goarch: s390x}
      - {goos: freebsd, goarch: arm}
      - {goos: freebsd, goarch: arm64}
      - {goos: freebsd, goarch: ppc64le}
      - {goos: freebsd, goarch: s390x}
    flags: [-tags=kqueue, -trimpath]
    ldflags:
      - "-s -w -X main.version={{.Tag}}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - CREDITS
      - src: internal/notify/LICENSE
        dst: licenses/notify-LICENSE
      - README.md
      - README_zh_CN.md
      - "docs/oc-phase*"
      - docs/compatibility.json

nfpms:
  - id: oc
    package_name: oc
    vendor: soulteary
    homepage: https://github.com/soulteary/mc
    maintainer: soulteary
    description: OC command-line client for OtterIO and S3-compatible storage.
    license: Apache-2.0
    bindir: /usr/bin
    formats: [deb, rpm]
    contents:
      - src: LICENSE
        dst: /usr/share/doc/oc/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/oc/NOTICE
      - src: CREDITS
        dst: /usr/share/doc/oc/CREDITS
      - src: internal/notify/LICENSE
        dst: /usr/share/doc/oc/notify-LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
