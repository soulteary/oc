name: Release

on:
  push:
    tags: ['RELEASE.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing RELEASE.YYYY-MM-DDTHH-MM-SSZ tag'
        required: true
        type: string
      promote_latest:
        description: 'Promote only if this is the newest published stable release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: oc-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and verify timestamp release and container images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Share this lock with the entire promotion workflow. Release it before
    # calling promotion so a newer publication cannot invalidate its plan.
    concurrency:
      group: oc-stable-promotion
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
      - name: Validate existing tag and source
        id: meta
        run: python3 buildscripts/release-preflight.py --existing "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Require successful main checks for the exact source
        env:
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          for workflow in go.yml codeql.yml; do
            result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${RELEASE_SHA}&branch=main&event=push&per_page=1" --jq '.workflow_runs[0] | [.status, .conclusion] | @tsv')"
            if [ "$result" != $'completed\tsuccess' ]; then
              echo "::error::${workflow} must succeed on main at ${RELEASE_SHA}."
              exit 1
            fi
          done
      - name: Refuse published releases and prerelease drafts
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft != true or .prerelease != false) | .tag_name' > "$RUNNER_TEMP/unavailable-tags"
          if grep -Fxq -- "$RELEASE_TAG" "$RUNNER_TEMP/unavailable-tags"; then
            echo '::error::Use a new tag; published releases cannot be rebuilt or overwritten.'
            exit 1
          fi
      - name: Validate optional Docker Hub credentials
        run: |
          set -euo pipefail
          if { [ -n "$DOCKERHUB_USERNAME" ] && [ -z "$DOCKERHUB_TOKEN" ]; } ||
             { [ -z "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; }; then
            echo '::error::Set both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, or neither.'
            exit 1
          fi
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build eleven target archives with source identity and licenses
        run: python3 buildscripts/build-release.py "$RELEASE_TAG" --output "$RUNNER_TEMP/oc-release"
      - name: Smoke test the packaged Linux amd64 executable
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          tar -xzf "$RUNNER_TEMP/oc-release/oc-${RELEASE_TAG}-linux-amd64.tar.gz" -C "$smoke_dir"
          binary="$smoke_dir/oc-${RELEASE_TAG}-linux-amd64/oc"
          "$binary" --version | grep -F -- "$RELEASE_TAG"
          "$binary" --help >/dev/null
      - name: Prepare the image context from verified release archives
        env:
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/oc-release" && sha256sum -c checksums.txt)
          python3 buildscripts/release-images.py "$RELEASE_TAG" \
            --artifacts "$RUNNER_TEMP/oc-release" --output "$RUNNER_TEMP/oc-image" \
            --source-sha "$RELEASE_SHA"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Compute and check fixed-version image tags
        id: tags
        run: |
          set -euo pipefail
          GHCR_REPO="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | LC_ALL=C tr '[:upper:]' '[:lower:]')"
          TAGS="${GHCR_REPO}:${RELEASE_TAG}"
          echo "ghcr_repository=$GHCR_REPO" >> "$GITHUB_OUTPUT"
          dockerhub_published=false
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            TAGS="${TAGS},${DOCKERHUB_USERNAME}/oc:${RELEASE_TAG}"
            dockerhub_published=true
          fi
          IFS=',' read -ra references <<< "$TAGS"
          bash buildscripts/check-new-image-tags.sh "${references[@]}"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "dockerhub_published=$dockerhub_published" >> "$GITHUB_OUTPUT"
      - name: Build and push fixed-version images
        uses: docker/build-push-action@v7.4.0
        id: image
        with:
          context: ${{ runner.temp }}/oc-image
          file: ${{ runner.temp }}/oc-image/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE=${{ steps.meta.outputs.tag }}
            SOURCE_SHA=${{ steps.meta.outputs.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          cache-from: type=gha,scope=oc-release
          cache-to: type=gha,scope=oc-release,mode=max
      - name: Verify the pushed image by digest
        env:
          IMAGE_REF: ${{ steps.tags.outputs.ghcr_repository }}@${{ steps.image.outputs.digest }}
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
        run: bash buildscripts/verify-release-image.sh "$IMAGE_REF" "$RELEASE_TAG" "$RELEASE_SHA" "https://github.com/$GITHUB_REPOSITORY" "$RUNNER_TEMP/oc-image"
      - name: Verify registry identities and record the image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
          DOCKERHUB_PUBLISHED: ${{ steps.tags.outputs.dockerhub_published }}
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          IFS=',' read -ra references <<< "$IMAGE_TAGS"
          for reference in "${references[@]}"; do
            actual="$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}' | jq -r .digest)"
            test "$actual" = "$IMAGE_DIGEST" || { echo '::error::Registry digest differs from the verified image.'; exit 1; }
          done
          python3 buildscripts/release-promotion.py "$RELEASE_TAG" \
            --write-manifest "$RUNNER_TEMP/oc-release/release-manifest.json" \
            --source-sha "$RELEASE_SHA" --repository "$GITHUB_REPOSITORY" \
            --digest "$IMAGE_DIGEST" --dockerhub-published "$DOCKERHUB_PUBLISHED" \
            --dockerhub-user "$DOCKERHUB_USERNAME"
          (cd "$RUNNER_TEMP/oc-release" && sha256sum oc-* release-manifest.json > checksums.txt)
      - name: Recheck the tag and checksums before publication
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python3 buildscripts/release-preflight.py --existing "$RELEASE_TAG"
          (cd "$RUNNER_TEMP/oc-release" && sha256sum -c checksums.txt)
      - name: Upload to a stable draft and verify every downloaded asset
        env:
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[]' | jq -s --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)]' > "$RUNNER_TEMP/release-state.json"
          if jq -e 'length == 0' "$RUNNER_TEMP/release-state.json" >/dev/null; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --target "$RELEASE_SHA" --title "OC $RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest=false
          else
            jq -e 'length == 1 and .[0].draft == true and .[0].prerelease == false' "$RUNNER_TEMP/release-state.json" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/oc-release/"* --repo "$GITHUB_REPOSITORY" --clobber
          verify_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          diff <(find "$RUNNER_TEMP/oc-release" -maxdepth 1 -type f -printf '%f\n' | sort) <(find "$verify_dir" -maxdepth 1 -type f -printf '%f\n' | sort)
          for asset in "$RUNNER_TEMP/oc-release/"*; do cmp "$asset" "$verify_dir/$(basename "$asset")"; done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

  promote:
    name: Promote the newest verified stable release
    needs: release
    if: github.event_name == 'push' || inputs.promote_latest
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/promote-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
