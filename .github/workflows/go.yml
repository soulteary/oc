name: Go

on:
  push:
    branches:
      - main
    tags:
      - "RELEASE.*"
  schedule:
    - cron: "0 2 * * 1"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test on Go ${{ matrix.go-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.27.1]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v6

      - name: Set up Go ${{ matrix.go-version }} on ${{ matrix.os }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - uses: ./.github/actions/go-cache
        with:
          build-scope: native-race-kqueue

      - name: Verify dependency and release boundaries
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          # Native Windows subprocess lookup can select the WSL bash.exe.
          # Pass the actual Actions shell to the release helper tests.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            OC_TEST_BASH="$(cygpath -w "$BASH")"
          else
            OC_TEST_BASH="$BASH"
          fi
          export OC_TEST_BASH
          go mod download
          python3 buildscripts/test-maintenance.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s buildscripts -p 'test_console_*.py' -v
          node buildscripts/test-console-web.js
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s buildscripts -p 'test_release_*.py' -v
          python3 buildscripts/verify-release-boundaries.py
          go mod verify
          python3 buildscripts/verify-release-boundaries.py

      - name: Build and test on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GO111MODULE: on
          GOTOOLCHAIN: local
        run: |
          go build --ldflags="-s -w" -o "${GOPATH}/bin/oc.exe" .
          go test -v -race -count=1 --timeout 30m ./...
          # Exercise real handle cancellation repeatedly with race/checkptr on.
          go test -race -count=100 --timeout 10m ./internal/notify -run 'TestWindowsClosePublishesInvalidHandleBeforeCompletion|TestWindowsCompletionReportsLoss|TestWindowsIdleStopRewatchReleasesHandles|TestWindowsRetiredCompletionKeepsReplacementWatch'

      - name: Build on Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GO111MODULE: on
          GOTOOLCHAIN: local
        run: make

      - name: Verify formatting and vet on Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GO111MODULE: on
          GOTOOLCHAIN: local
        run: |
          diff -au <(gofmt -d ./*.go) <(printf "")
          diff -au <(gofmt -s -d cmd) <(printf "")
          diff -au <(gofmt -s -d pkg) <(printf "")
          go vet ./...

      - name: Test with race detection on Linux
        if: matrix.os == 'ubuntu-latest'
        env:
          GO111MODULE: on
          GOTOOLCHAIN: local
        run: go test -race -v -count=1 --timeout 20m ./...

      - name: Build the race-instrumented Linux executable
        if: matrix.os == 'ubuntu-latest'
        env:
          GO111MODULE: on
          GOTOOLCHAIN: local
        run: |
          go build -race -tags kqueue -trimpath -o "$RUNNER_TEMP/oc-race" .

      - name: Build and test on macOS
        if: matrix.os == 'macos-latest'
        env:
          GOTOOLCHAIN: local
        run: |
          make build
          go vet ./...
          go test -race -count=1 --timeout 30m ./...

      - name: Lint on Linux
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

  crosscompile:
    name: Cross-compile all eleven supported targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          build-scope: cross-eleven-targets-cgo0-kqueue
      - name: Verify all supported platform builds
        env:
          GOTOOLCHAIN: local
        run: make crosscompile

  core-integration:
    name: OC and pinned OtterIO on ${{ matrix.os }} (cgo=${{ matrix.cgo }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cgo: ['0', '1']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          build-scope: core-cgo${{ matrix.cgo }}-trimpath
      - name: Build OC and the local console
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          go mod download
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/oc" .
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/oc-console" ./cmd/oc-console

      - name: Prepare the pinned OtterIO source
        env:
          GOTOOLCHAIN: local
        run: |
          otterio_source=$(go list -m -f '{{.Dir}}' github.com/soulteary/otterio)
          cp -R "$otterio_source" "$RUNNER_TEMP/otterio-source"
          chmod -R u+w "$RUNNER_TEMP/otterio-source"

      - name: Test the pinned OtterIO regressions
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          cd "$RUNNER_TEMP/otterio-source"
          # The pinned module includes the server fixes. Build its exact source
          # without layering patches or using an adjacent developer checkout.
          go test -mod=readonly ./cmd/http -run TestShutdownBoundsActiveFiberRequest -count=1
          go test -mod=readonly ./cmd/http -run 'TestHTTPListenerClose|TestServerCounts|TestShutdown|TestTLSServer' -count=3
          go test -mod=readonly ./cmd -run 'TestAdminQueryBridge|TestDarwinRestartSupervisor|TestEncodedObjectPath|TestAdminHealWildcard|TestStreamContext|TestFiberRequestContextValues|TestAccountInfoOwnerAndScopedPrincipals|TestConditional' -count=3

      - name: Build the pinned OtterIO server
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          cd "$RUNNER_TEMP/otterio-source"
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/otterio" .
      - name: Verify CLI startup, gateways, management routing and signal exits
        env:
          CLI_TEST_OTTERIO_BINARY: ${{ runner.temp }}/otterio
          CLI_TEST_OC_BINARY: ${{ runner.temp }}/oc
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cd "$RUNNER_TEMP/otterio-source"
          python3 -m unittest discover -s buildscripts -p test_cli_integration.py -v
      - name: Verify ports, TLS, permissions, streams and performance budgets
        run: |
          python3 buildscripts/test-core-integration.py --oc "$RUNNER_TEMP/oc" --otterio "$RUNNER_TEMP/otterio" --extended --stability --soak-seconds 30 --report "$RUNNER_TEMP/core-integration.json" --artifacts-dir "$RUNNER_TEMP/core-evidence"
      - name: Verify the local read-only console
        run: |
          python3 buildscripts/test-console-integration.py \
            --cli "$RUNNER_TEMP/oc" --console "$RUNNER_TEMP/oc-console" \
            --server "$RUNNER_TEMP/otterio" \
            --server-source "$(python3 -c 'import json; print(json.load(open("docs/compatibility.json"))["otterioSource"])')" \
            --settings-legacy \
            --output "$RUNNER_TEMP/console-integration.json"
      - name: Verify opt-in console writes and cancellation
        run: |
          python3 buildscripts/test-console-integration.py \
            --cli "$RUNNER_TEMP/oc" --console "$RUNNER_TEMP/oc-console" \
            --server "$RUNNER_TEMP/otterio" --writes \
            --server-source "$(python3 -c 'import json; print(json.load(open("docs/compatibility.json"))["otterioSource"])')" \
            --output "$RUNNER_TEMP/console-write-integration.json"
      - name: Verify new console features safely downgrade on the pinned server
        run: |
          python3 buildscripts/test-console-integration.py \
            --cli "$RUNNER_TEMP/oc" --console "$RUNNER_TEMP/oc-console" \
            --server "$RUNNER_TEMP/otterio" --features --features-legacy \
            --server-source "$(python3 -c 'import json; print(json.load(open("docs/compatibility.json"))["otterioSource"])')" \
            --output "$RUNNER_TEMP/console-features-legacy-integration.json"
      - name: Build the standalone console base protocol
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          # Keep the unpatched pin and each protocol composition independent.
          cp -R "$RUNNER_TEMP/otterio-source" "$RUNNER_TEMP/otterio-console-base-source"
          cd "$RUNNER_TEMP/otterio-console-base-source"
          git apply --check "$GITHUB_WORKSPACE/buildscripts/console-server-base.patch"
          git apply "$GITHUB_WORKSPACE/buildscripts/console-server-base.patch"
          go test -mod=readonly ./cmd -run 'TestBucketConfig|TestSelfCredentials|TestConfiguration|TestFiber|TestGetBucket|TestPutBucket|TestDeleteBucket|TestAccountInfo|TestBucketMetadata' -count=1
          if [[ "$CGO_ENABLED" == "1" ]]; then
            go test -mod=readonly -race ./cmd -run 'TestBucketConfig|TestSelfCredentials|TestConfiguration|TestFiber|TestGetBucket|TestPutBucket|TestDeleteBucket|TestAccountInfo|TestBucketMetadata' -count=1
          fi
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/otterio-console-base" .
      - name: Verify protected settings against the standalone base
        run: |
          python3 buildscripts/test-console-integration.py \
            --cli "$RUNNER_TEMP/oc" --console "$RUNNER_TEMP/oc-console" \
            --server "$RUNNER_TEMP/otterio-console-base" --settings --settings-base \
            --server-source "$(python3 -c 'import json; print(json.load(open("docs/compatibility.json"))["otterioSource"])')" \
            --server-patch buildscripts/console-server-base.patch \
            --output "$RUNNER_TEMP/console-base-settings-integration.json"
      - name: Verify object writes against the standalone base
        run: |
          python3 buildscripts/test-console-integration.py \
            --cli "$RUNNER_TEMP/oc" --console "$RUNNER_TEMP/oc-console" \
            --server "$RUNNER_TEMP/otterio-console-base" --writes \
            --server-source "$(python3 -c 'import json; print(json.load(open("docs/compatibility.json"))["otterioSource"])')" \
            --server-patch buildscripts/console-server-base.patch \
            --output "$RUNNER_TEMP/console-base-object-integration.json"
      - name: Build base with version authorization and conditional IAM
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          cp -R "$RUNNER_TEMP/otterio-console-base-source" "$RUNNER_TEMP/otterio-console-features-source"
          cd "$RUNNER_TEMP/otterio-console-features-source"
          git apply --check "$GITHUB_WORKSPACE/buildscripts/console-features-server.patch"
          git apply "$GITHUB_WORKSPACE/buildscripts/console-features-server.patch"
          git apply --check "$GITHUB_WORKSPACE/buildscripts/console-iam-bindings.patch"
          git apply "$GITHUB_WORKSPACE/buildscripts/console-iam-bindings.patch"
          go test -mod=readonly ./cmd -run '^TestConsoleVersionAuthorization|^TestConsoleIAM' -count=1
          go test -mod=readonly ./pkg/iam/policy ./pkg/bucket/policy -count=1
          if [[ "$CGO_ENABLED" == "1" ]]; then
            go test -mod=readonly -race ./cmd -run '^TestConsoleVersionAuthorization|^TestConsoleIAM' -count=1
          fi
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/otterio-console-features" .
      - name: Verify all five console features without lifecycle storage
        run: |
          python3 buildscripts/test-console-integration.py \
            --cli "$RUNNER_TEMP/oc" --console "$RUNNER_TEMP/oc-console" \
            --server "$RUNNER_TEMP/otterio-console-features" --features --version-copy \
            --server-source "$(python3 -c 'import json; print(json.load(open("docs/compatibility.json"))["otterioSource"])')" \
            --server-patch buildscripts/console-server-base.patch \
            --server-patch buildscripts/console-features-server.patch \
            --server-patch buildscripts/console-iam-bindings.patch \
            --output "$RUNNER_TEMP/console-base-features-integration.json"
      - name: Build the independent base storage and mandatory hardening composition
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          cp -R "$RUNNER_TEMP/otterio-console-base-source" "$RUNNER_TEMP/otterio-lifecycle-storage-source"
          cd "$RUNNER_TEMP/otterio-lifecycle-storage-source"
          git apply --check "$GITHUB_WORKSPACE/buildscripts/lifecycle-storage.patch"
          git apply "$GITHUB_WORKSPACE/buildscripts/lifecycle-storage.patch"
          git apply --check "$GITHUB_WORKSPACE/buildscripts/lifecycle-storage-hardening.patch"
          git apply "$GITHUB_WORKSPACE/buildscripts/lifecycle-storage-hardening.patch"
          go test -mod=readonly ./cmd -run 'TestBucketConfig|TestSelfCredentials|TestConfiguration|TestFiber|TestGetBucket|TestPutBucket|TestDeleteBucket|TestAccountInfo|TestBucketMetadata|TestBucketTarget|TestTransition|TestXLStorageInline|TestLifecycleTransition|TestLifecycleQueues|TestScannerLifecycle|TestExpiry|TestParseRestore|TestRestoreRequest|TestBeginRestore|TestRestoredVersion|TestPutObjectExpiry|TestFindFileInfoInQuorum|TestXLV2FormatData|TestErasureDeleteObjectBasic|TestErasureDeleteObjectsErasureSet' -count=1
          go test -mod=readonly ./pkg/bucket/lifecycle -count=1
          go test -mod=readonly ./cmd/config/storageclass -count=1
          go test -mod=readonly ./cmd -run 'TestErasurePutObject|TestXLStorageReadFile|TestXLStorageHealsPendingTransitionMetadata|TestMonitorAndConnectEndpointsCanceled|TestPutObjectNoQuorum|TestObjectQuorumFromMeta|TestDisksWithAllParts' -count=1
          if [[ "$CGO_ENABLED" == "1" ]]; then
            go test -mod=readonly -race ./pkg/bucket/lifecycle ./cmd/config/storageclass -count=1
            go test -mod=readonly -race ./cmd -run 'TestErasurePutObject|TestXLStorageReadFile|TestXLStorageHealsPendingTransitionMetadata|TestMonitorAndConnectEndpointsCanceled|TestPutObjectNoQuorum|TestObjectQuorumFromMeta|TestDisksWithAllParts' -count=1
          fi
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/otterio-lifecycle-storage" .
      - name: Verify lifecycle execution and restore against a separate tier
        run: |
          python3 buildscripts/test-lifecycle-transition-integration.py \
            --cli "$RUNNER_TEMP/oc" --console "$RUNNER_TEMP/oc-console" \
            --server "$RUNNER_TEMP/otterio-lifecycle-storage" \
            --server-source "$(python3 -c 'import json; print(json.load(open("docs/compatibility.json"))["otterioSource"])')" \
            --server-patch buildscripts/console-server-base.patch \
            --server-patch buildscripts/lifecycle-storage.patch \
            --server-patch buildscripts/lifecycle-storage-hardening.patch \
            --output "$RUNNER_TEMP/lifecycle-storage-integration.json"
      - name: Build the independent combined console regression server
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          cp -R "$RUNNER_TEMP/otterio-lifecycle-storage-source" "$RUNNER_TEMP/otterio-console-combined-source"
          cd "$RUNNER_TEMP/otterio-console-combined-source"
          git apply --check "$GITHUB_WORKSPACE/buildscripts/console-features-server.patch"
          git apply "$GITHUB_WORKSPACE/buildscripts/console-features-server.patch"
          git apply --check "$GITHUB_WORKSPACE/buildscripts/console-iam-bindings.patch"
          git apply "$GITHUB_WORKSPACE/buildscripts/console-iam-bindings.patch"
          go test -mod=readonly ./cmd -run '^TestConsoleVersionAuthorization|^TestConsoleIAM' -count=1
          if [[ "$CGO_ENABLED" == "1" ]]; then
            go test -mod=readonly -race ./cmd -run '^TestConsoleVersionAuthorization|^TestConsoleIAM' -count=1
          fi
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/otterio-console-combined" .
      - name: Verify five-feature composition after lifecycle storage
        run: |
          python3 buildscripts/test-console-integration.py \
            --cli "$RUNNER_TEMP/oc" --console "$RUNNER_TEMP/oc-console" \
            --server "$RUNNER_TEMP/otterio-console-combined" --features --version-copy \
            --server-source "$(python3 -c 'import json; print(json.load(open("docs/compatibility.json"))["otterioSource"])')" \
            --server-patch buildscripts/console-server-base.patch \
            --server-patch buildscripts/lifecycle-storage.patch \
            --server-patch buildscripts/lifecycle-storage-hardening.patch \
            --server-patch buildscripts/console-features-server.patch \
            --server-patch buildscripts/console-iam-bindings.patch \
            --output "$RUNNER_TEMP/console-combined-features-integration.json"
      - name: Verify protected settings and object writes in the combined server
        run: |
          python3 buildscripts/test-console-integration.py \
            --cli "$RUNNER_TEMP/oc" --console "$RUNNER_TEMP/oc-console" \
            --server "$RUNNER_TEMP/otterio-console-combined" --settings --writes \
            --server-source "$(python3 -c 'import json; print(json.load(open("docs/compatibility.json"))["otterioSource"])')" \
            --server-patch buildscripts/console-server-base.patch \
            --server-patch buildscripts/lifecycle-storage.patch \
            --server-patch buildscripts/lifecycle-storage-hardening.patch \
            --server-patch buildscripts/console-features-server.patch \
            --server-patch buildscripts/console-iam-bindings.patch \
            --output "$RUNNER_TEMP/console-combined-settings-object-integration.json"
      - name: Verify combined lifecycle execution and restore against a separate tier
        run: |
          python3 buildscripts/test-lifecycle-transition-integration.py \
            --cli "$RUNNER_TEMP/oc" --console "$RUNNER_TEMP/oc-console" \
            --server "$RUNNER_TEMP/otterio-console-combined" \
            --server-source "$(python3 -c 'import json; print(json.load(open("docs/compatibility.json"))["otterioSource"])')" \
            --server-patch buildscripts/console-server-base.patch \
            --server-patch buildscripts/lifecycle-storage.patch \
            --server-patch buildscripts/lifecycle-storage-hardening.patch \
            --server-patch buildscripts/console-features-server.patch \
            --server-patch buildscripts/console-iam-bindings.patch \
            --output "$RUNNER_TEMP/console-combined-lifecycle-integration.json"
      - name: Upload compatibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-integration-${{ matrix.os }}-cgo-${{ matrix.cgo }}
          path: |
            ${{ runner.temp }}/core-integration.json
            ${{ runner.temp }}/core-evidence/
            ${{ runner.temp }}/console-integration.json
            ${{ runner.temp }}/console-write-integration.json
            ${{ runner.temp }}/console-base-settings-integration.json
            ${{ runner.temp }}/console-base-object-integration.json
            ${{ runner.temp }}/lifecycle-storage-integration.json
            ${{ runner.temp }}/console-features-legacy-integration.json
            ${{ runner.temp }}/console-base-features-integration.json
            ${{ runner.temp }}/console-combined-features-integration.json
            ${{ runner.temp }}/console-combined-settings-object-integration.json
            ${{ runner.temp }}/console-combined-lifecycle-integration.json

  inventory:
    name: Binary dependency inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          build-scope: inventory-cgo0-trimpath
      - name: Build and inventory the compiled modules
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          python3 buildscripts/test-maintenance.py
          python3 buildscripts/verify-release-boundaries.py
          go mod verify
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/oc" .
          python3 buildscripts/generate-sbom.py --binary "$RUNNER_TEMP/oc" --output "$RUNNER_TEMP/oc.cdx.json" --require-clean
      - uses: actions/upload-artifact@v4
        with:
          name: oc-compiled-module-inventory
          path: ${{ runner.temp }}/oc.cdx.json

  vulnerability-check:
    name: Go reachable vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          build-scope: govulncheck-v1.8.0
      - name: Scan current source with the Go vulnerability database
        env:
          GOTOOLCHAIN: local
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
