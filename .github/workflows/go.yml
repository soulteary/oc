name: Go

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "0 2 * * 1"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test on Go ${{ matrix.go-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.27.1]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v6

      - name: Set up Go ${{ matrix.go-version }} on ${{ matrix.os }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify dependency and release boundaries
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          go mod download
          go mod verify
          python3 buildscripts/verify-release-boundaries.py

      - name: Build and test on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GO111MODULE: on
          GOTOOLCHAIN: local
        run: |
          go build --ldflags="-s -w" -o "${GOPATH}/bin/oc.exe" .
          go test -v -race --timeout 30m ./...

      - name: Build, verify and test on Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GO111MODULE: on
          GOTOOLCHAIN: local
        run: |
          make
          diff -au <(gofmt -d *.go) <(printf "")
          diff -au <(gofmt -s -d cmd) <(printf "")
          diff -au <(gofmt -s -d pkg) <(printf "")
          go vet ./...
          go test -race -v --timeout 20m ./...
          go build -race -tags kqueue -trimpath -o "$RUNNER_TEMP/oc-race" .
          make crosscompile

      - name: Build and test on macOS
        if: matrix.os == 'macos-latest'
        env:
          GOTOOLCHAIN: local
        run: |
          make build
          go vet ./...
          go test -race --timeout 30m ./...

      - name: Lint on Linux
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

  core-integration:
    name: OC and pinned OtterIO on ${{ matrix.os }} (cgo=${{ matrix.cgo }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cgo: ['0', '1']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build OC and the pinned OtterIO server
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          go mod download
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/oc" .
          otterio_source=$(go list -m -f '{{.Dir}}' github.com/soulteary/otterio)
          cp -R "$otterio_source" "$RUNNER_TEMP/otterio-source"
          chmod -R u+w "$RUNNER_TEMP/otterio-source"
          cd "$RUNNER_TEMP/otterio-source"
          # The SDK pin remains unchanged; this explicit server fix is required
          # until a release includes the query bridge and runtime fixes.
          git apply "$GITHUB_WORKSPACE/buildscripts/otterio-core-compat.patch"
          git apply "$GITHUB_WORKSPACE/buildscripts/otterio-runtime-compat.patch"
          go test -mod=readonly ./cmd/http -run TestShutdownBoundsActiveFiberRequest -count=1
          go test -mod=readonly ./cmd -run 'TestAdminQueryBridge|TestDarwinRestartSupervisor' -count=3
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/otterio" .
      - name: Verify single and dual ports, TLS, permissions and metrics
        run: |
          python3 buildscripts/test-core-integration.py --oc "$RUNNER_TEMP/oc" --otterio "$RUNNER_TEMP/otterio" --extended --report "$RUNNER_TEMP/core-integration.json"
      - name: Upload compatibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-integration-${{ matrix.os }}-cgo-${{ matrix.cgo }}
          path: ${{ runner.temp }}/core-integration.json
