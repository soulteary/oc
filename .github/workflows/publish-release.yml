name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing verified stable draft RELEASE.YYYY-MM-DDTHH-MM-SSZ tag'
        required: true
        type: string
      acceptance_run_id:
        description: 'Successful main console-release-acceptance.yml workflow_dispatch run'
        required: true
        type: string
      attestation_sha256:
        description: 'Independently reviewed SHA-256 of the console-release-acceptance attestation'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oc-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate accepted draft bytes and publish without changing latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: oc-stable-promotion
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      CONSOLE_RELEASE_TOKEN: ${{ secrets.CONSOLE_RELEASE_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
      ATTESTATION_SHA256: ${{ inputs.attestation_sha256 }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require publication from main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Login to GHCR for existing image verification
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GH_TOKEN }}
      - name: Login to Docker Hub for existing image verification
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Validate official acceptance and publish the unchanged stable draft
        run: |
          python3 buildscripts/release-stage.py publish \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
            --attestation-sha256 "$ATTESTATION_SHA256"
