name: Restore Go caches
description: Keep downloaded modules separate from workload-specific compiler snapshots
inputs:
  build-scope:
    description: Workload and compiler flags, including cgo, race, tags or target set
    required: true
  dependency-files:
    description: go.sum files that identify the downloaded module set
    default: go.sum
runs:
  using: composite
  steps:
    - name: Locate Go cache directories
      id: paths
      shell: bash
      env:
        GOTOOLCHAIN: local
      run: |
        oc_modules_cache="$(go env GOMODCACHE)"
        oc_build_cache="$(go env GOCACHE)"
        oc_go_version="$(go env GOVERSION)"
        printf 'modules=%s\nbuild=%s\nversion=%s\n' "$oc_modules_cache" "$oc_build_cache" "$oc_go_version" >> "$GITHUB_OUTPUT"
    - name: Cache downloaded modules
      uses: actions/cache@v5
      with:
        path: ${{ steps.paths.outputs.modules }}
        key: oc-go-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ hashFiles(inputs.dependency-files) }}
        restore-keys: |
          oc-go-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-
    # Only successful main pushes publish compiler snapshots. PRs reuse main
    # snapshots without uploading another large cache for every branch update.
    - name: Restore and update main compiler snapshot
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache@v5
      with:
        path: ${{ steps.paths.outputs.build }}
        key: oc-go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ inputs.build-scope }}-${{ hashFiles(inputs.dependency-files) }}-${{ github.sha }}
        restore-keys: |
          oc-go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ inputs.build-scope }}-${{ hashFiles(inputs.dependency-files) }}-
          oc-go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ inputs.build-scope }}-
    - name: Restore compiler snapshot for checks
      if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.paths.outputs.build }}
        key: oc-go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ inputs.build-scope }}-${{ hashFiles(inputs.dependency-files) }}-${{ github.sha }}
        restore-keys: |
          oc-go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ inputs.build-scope }}-${{ hashFiles(inputs.dependency-files) }}-
          oc-go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ inputs.build-scope }}-
